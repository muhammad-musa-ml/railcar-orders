name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests and CDK template assertions. Integration tests need DynamoDB Local
      # and run locally (see README).
      - run: npm test
      # No AWS credentials here: synth only needs the CDK app, not an account.
      - run: npm run synth
